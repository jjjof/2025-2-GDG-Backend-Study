spring:
  application:
    name: shop

  datasource:
    url: jdbc:h2:mem:shop;MODE=MYSQL

  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# [질문 정리 1] application.yml은 들여쓰기로 계층 구조를 표현하는 설정 파일이다.
# application.properties는 spring.datasource.url=...처럼 key=value 형태로 같은 설정을 표현한다.
#
# [질문 정리 2] jdbc:h2:mem:shop은 메모리 기반 H2 DB를 사용한다는 뜻이다.
# 애플리케이션이 종료되면 메모리 DB 내용은 사라진다.
#
# [질문 정리 3] MODE=MYSQL은 H2가 MySQL과 비슷한 문법을 일부 허용하도록 하는 H2 설정이다.
# Hibernate dialect를 MySQL8Dialect로 강제하는 것과는 역할이 다르다.
#
# [질문 정리 4] Spring Boot 4/Hibernate 7 환경에서는 org.hibernate.dialect.MySQL8Dialect를 찾지 못할 수 있다.
# H2를 쓰는 현재 설정에서는 dialect를 직접 지정하지 않아도 Hibernate가 JDBC URL을 보고 적절히 판단한다.
#
# [질문 정리 5] show-sql은 Hibernate가 실행하는 SQL을 로그에 출력한다.
# format_sql은 출력되는 SQL을 보기 좋게 줄바꿈해서 보여준다.
